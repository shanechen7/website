<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>货物进度追踪</title>
    <style>
        :root {
            --primary: #0f4c81;
            --primary-light: #3a7bd5;
            --card-bg: #ffffff;
            --text: #1e293b;
            --text-light: #64748b;
            --border: #e2e8f0;
            --danger: #dc2626;
            --danger-bg: #fee2e2;
            --step-done: #0f9b8e;
            --step-active: #f0a500;
            --step-pending: #334155;
            --ease: cubic-bezier(.22,.61,.36,1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', sans-serif;
            background: #0f172a;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 960px;
            background: var(--card-bg);
            border-radius: 24px;
            box-shadow: 0 20px 35px rgba(0,0,0,0.2);
            padding: 32px;
        }

        .header { text-align: center; margin-bottom: 24px; }
        .logo-area { display: flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: 8px; }
        .logo-icon {
            width: 42px; height: 42px;
            background: linear-gradient(135deg, var(--primary-light), var(--primary));
            border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            color: white; font-size: 22px;
        }
        h1 { font-size: 22px; font-weight: 700; color: var(--text); }
        .subtitle { color: var(--text-light); font-size: 14px; }
        .company-badge { font-size: 12px; color: #64748b; margin-top: 4px; }
        #langSwitcher { margin-top: 8px; font-size: 14px; }
        #langSwitcher a { color: var(--primary); text-decoration: none; margin: 0 4px; }
        #langSwitcher a:hover { text-decoration: underline; }

        .result-area {
            background: #fff; border-radius: 16px; border: 1px solid var(--border);
            padding: 20px; min-height: 100px;
        }
        .placeholder, .loading-spinner { text-align: center; color: var(--text-light); padding: 20px; }
        .spinner {
            width: 28px; height: 28px; border: 3px solid #e2e8f0;
            border-top-color: var(--primary-light); border-radius: 50%;
            animation: spin 0.8s linear infinite; margin: 0 auto 10px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .error-box { background: var(--danger-bg); color: var(--danger); padding: 14px; border-radius: 12px; text-align: center; }

        .client-info {
            background: linear-gradient(135deg, #1e293b, #0f172a);
            color: white; border-radius: 12px; padding: 12px 16px;
            margin-bottom: 16px; display: flex; justify-content: space-between;
            align-items: center; border: 1px solid rgba(255,255,255,0.1);
        }
        .client-name { font-weight: 600; }
        .record-count { font-size: 14px; opacity: 0.85; }

        /* 订单分类筛选栏 */
        .filter-bar {
            display: flex; gap: 10px; margin-bottom: 20px;
        }
        .filter-btn {
            flex: 1; padding: 10px 16px;
            background: #f1f5f9; border: 1px solid var(--border);
            border-radius: 100px; cursor: pointer;
            font-size: 14px; font-weight: 600; color: var(--text-light);
            transition: all 0.2s var(--ease);
            font-family: inherit;
        }
        .filter-btn:hover { background: #e2e8f0; transform: translateY(-1px); }
        .filter-btn.active {
            background: var(--primary); color: white; border-color: var(--primary);
            box-shadow: 0 4px 12px rgba(15, 76, 129, 0.2);
        }

        .shipment-list { display: flex; flex-direction: column; gap: 16px; }

        /* 卡片：折叠状态下可 hover 上浮 */
        .shipment-card {
            border: 1px solid var(--border); border-radius: 16px; padding: 18px;
            transition: transform 0.25s var(--ease), box-shadow 0.25s var(--ease), border-color 0.25s var(--ease);
        }
        .shipment-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
        }
        /* 展开状态：不上浮，改用更深的阴影 + 边框 */
        .shipment-card.expanded {
            transform: none;
            box-shadow: 0 10px 28px rgba(15,76,129,0.12);
            border-color: #cbd5e1;
        }
        .shipment-card.expanded:hover { transform: none; }

        /* header 始终可见，是点击触发区 */
        .card-header {
            display: flex; justify-content: space-between; align-items: center;
            gap: 12px; cursor: pointer; user-select: none;
            border-radius: 10px; margin: -4px; padding: 4px;
            transition: background 0.2s;
        }
        .card-header:hover { background: #f8fafc; }
        .card-header:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
        .header-left { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1; }
        .bl-number { font-weight: 700; font-size: 15px; color: var(--primary); }
        .header-right { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
        .status-badge {
            padding: 4px 12px; border-radius: 100px; font-size: 13px; font-weight: 600;
        }
        .expand-icon {
            width: 28px; height: 28px; flex-shrink: 0;
            border-radius: 50%; background: #f1f5f9; color: #64748b;
            display: inline-flex; align-items: center; justify-content: center;
            font-size: 12px;
            transition: transform 0.4s var(--ease), background 0.2s, color 0.2s;
        }
        .card-header:hover .expand-icon { background: #e2e8f0; }
        .shipment-card.expanded .expand-icon {
            transform: rotate(180deg);
            background: var(--primary); color: white;
        }

        /* 折叠容器：grid-template-rows 0fr → 1fr 精确过渡 */
        .card-body {
            display: grid;
            grid-template-rows: 0fr;
            transition: grid-template-rows 0.45s var(--ease);
        }
        .shipment-card.expanded .card-body { grid-template-rows: 1fr; }
        .card-body-inner { overflow: hidden; min-height: 0; }

        .stepper { margin: 16px 0 20px; }
        .steps-container {
            display: flex; justify-content: space-between; align-items: flex-start;
            position: relative; padding: 8px 0;
        }
        .steps-container::before {
            content: ""; position: absolute; top: 23px; left: 0; right: 0;
            height: 2px; background: var(--step-pending); z-index: 0;
        }
        .step-item {
            display: flex; flex-direction: column; align-items: center;
            position: relative; z-index: 1; flex: 1; text-align: center;
        }
        .step-circle {
            width: 30px; height: 30px; border-radius: 50%;
            background: white; border: 3px solid var(--step-pending);
            display: flex; align-items: center; justify-content: center;
            font-size: 13px; font-weight: bold; margin-bottom: 4px;
            transition: all 0.3s;
        }
        .step-label { font-size: 11px; color: #94a3b8; max-width: 75px; word-break: break-word; }
        .step-time { font-size: 10px; color: #64748b; white-space: nowrap; }
        .step-item.done .step-circle {
            box-shadow: 0 0 10px rgba(16,185,129,0.5);
            border-color: var(--step-done); background: var(--step-done); color: white;
        }
        .step-item.done .step-label, .step-item.done .step-time { color: var(--step-done); }
        .step-item.active .step-circle {
            border-color: var(--step-active); background: var(--step-active); color: white;
            animation: pulse 1.5s infinite, rotateGlow 3s infinite;
        }
        .step-item.active .step-label { color: var(--step-active); font-weight: 700; }
        .step-item.active .step-time { color: var(--step-active); font-weight: 600; }
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(240,165,0,0.4); }
            70% { box-shadow: 0 0 0 10px rgba(240,165,0,0); }
            100% { box-shadow: 0 0 0 0 rgba(240,165,0,0.4); }
        }
        @keyframes rotateGlow {
            0% { box-shadow: 0 0 0 0 rgba(240,165,0,0.4); }
            50% { box-shadow: 0 0 0 12px rgba(240,165,0,0); }
            100% { box-shadow: 0 0 0 0 rgba(240,165,0,0.4); }
        }
        .current-status { text-align: center; margin-top: 6px; font-weight: 600; color: var(--primary); }

        .detail-grid {
            display: grid; gap: 10px; margin-top: 0;
            grid-template-columns: 1fr;
            border-top: 1px dashed var(--border); padding-top: 14px;
        }
        .detail-item { display: flex; align-items: baseline; gap: 8px; padding: 3px 0; }
        .detail-label {
            width: 130px; flex-shrink: 0; text-align: right;
            color: #94a3b8; font-weight: 600; font-size: 13px; word-break: break-word;
        }
        .detail-value { flex: 1; font-size: 15px; color: var(--text); word-break: break-word; }
        .vp-link { color: #2563eb; text-decoration: underline; cursor: pointer; }
        .vp-link:hover { color: #1d4ed8; }

        /* 首页输入框样式 */
        .entry-box {
            max-width: 420px;
            margin: 0 auto;
        }
        .code-input-group {
            display: flex;
            gap: 10px;
            margin-top: 24px;
        }
        .code-input {
            flex: 1;
            padding: 14px 16px;
            border: 1px solid var(--border);
            border-radius: 12px;
            font-size: 15px;
            font-family: inherit;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
            color: var(--text);
        }
        .code-input:focus {
            border-color: var(--primary-light);
            box-shadow: 0 0 0 3px rgba(58, 123, 213, 0.15);
        }
        .query-btn {
            padding: 14px 24px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            font-family: inherit;
            white-space: nowrap;
        }
        .query-btn:hover { background: #0a3a63; }
        .query-btn:active { transform: scale(0.97); }
        .error-msg {
            color: var(--danger);
            font-size: 13px;
            margin-top: 12px;
            min-height: 20px;
            text-align: left;
        }

        @media (max-width: 600px) {
            .container { padding: 20px; }
            .filter-bar { gap: 8px; }
            .filter-btn { padding: 8px 10px; font-size: 13px; }
            .steps-container { flex-direction: column; align-items: flex-start; }
            .steps-container::before { top: 0; left: 14px; width: 2px; height: 100%; }
            .step-item { flex-direction: row; align-items: center; gap: 10px; width: 100%; padding: 5px 0; text-align: left; }
            .step-circle { margin-bottom: 0; }
            .step-label { max-width: none; }
            .step-time { margin-left: auto; }
            .detail-label { width: 70px; }
            .bl-number { font-size: 14px; }
            .status-badge { font-size: 12px; padding: 3px 10px; }
            
            /* 移动端输入框和按钮上下排列 */
            .code-input-group { flex-direction: column; }
            .query-btn { width: 100%; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                transition-duration: 0.01ms !important;
            }
        }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #1e293b; }
        ::-webkit-scrollbar-thumb { background: #475569; border-radius: 3px; }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
<div class="container">
    <div class="header">
        <div class="logo-area">
            <div class="logo-icon"><i class="fas fa-ship"></i></div>
            <h1 id="mainTitle"></h1>
        </div>
        <div class="subtitle" id="subtitleText"></div>
        <div class="company-badge" id="companyText"></div>
        <div id="langSwitcher"></div>
    </div>

    <div id="clientBar" class="client-info" style="display:none;">
        <span class="client-name" id="clientName"></span>
        <span class="record-count" id="recordCount"></span>
    </div>

    <!-- 订单分类筛选栏 -->
    <div id="filterBar" class="filter-bar" style="display:none;">
        <button class="filter-btn active" data-filter="all" id="btnAll"></button>
        <button class="filter-btn" data-filter="inProgress" id="btnInProgress"></button>
        <button class="filter-btn" data-filter="completed" id="btnCompleted"></button>
    </div>

    <div class="result-area" id="resultArea"><div class="placeholder"></div></div>
    <div id="disclaimer" style="text-align:center; font-size:12px; color:#94a3b8; margin-top:16px;"></div>
</div>

<script>
    // ---------- 配置（替换为你的真实凭据，确保不包含中文字符）----------
    const AIRTABLE_TOKEN = 'patZPFlJbLqwTJtIC.1843c675c787061ebfd593a33455125587fbbc218236764fd930c45b90efa8d3';
    const BASE_ID = 'appgsZddbYClwerXP';
    const TABLE_ID = 'tbl36j24zEnTk5a2A';

    const DETAIL_FIELDS = ['POL（起运港）', 'POD（目的港）', 'ETD（开航日）', 'ETA（抵港日）', 'V/V（船名航次）', 'C/V（货量）', 'S/M（运输方式）', 'V/P（船舶位置）','快递位置'];
    const STEPS_KEYWORDS = [
        { keywords: ['进仓','received at warehouse'], timeField: '进仓时间' },
        { keywords: ['进港','arrived at port'], timeField: '进港时间' },
        { keywords: ['启运','departed'], timeField: '启运时间' },
        { keywords: ['航行','in transit'], timeField: null },
        { keywords: ['到港','arrived at destination port'], timeField: '到港时间' },
        { keywords: ['卸船','清关','discharged','customs clearance'], timeField: '卸船/清关时间' },
        { keywords: ['派送','out for delivery'], timeField: '派送时间' },
        { keywords: ['交付','delivered'], timeField: '交付时间' }
    ];
    const STEPS_COUNT = STEPS_KEYWORDS.length;

    // 全局变量，保存获取到的所有订单
    let allRecords = [];

    // ---------- 语言包 ----------
    const LANG = {
        zh: {
            title:'BLM货物追踪系统（先行版）', subtitle:'实时查询货物物流状态', company:'BLM Logistic',
            clientPrefix:'客户：', totalShipments:'票货物', noData:'该客户暂无在途货物', noDataFiltered:'该分类下暂无货物',
            noClient:'请输入您的客户专属代码', contactUs:'查询您的货物物流状态',
            statusUnknown:'未更新', currentStatus:'当前状态', viewOnMap:'点击查看',
            blLabel:'单号(B/L)：', loading:'正在加载货物列表...',
            filterAll:'全部订单', filterInProgress:'进行中', filterCompleted:'已完成',
            enterCodePlaceholder:'请输入客户专属代码', queryBtn:'立即查询', invalidCode:'请输入有效的客户代码',
            fieldLabels: { 'POL（起运港）':'起运港','POD（目的港）':'目的港','ETD（开航日）':'开航日','ETA（抵港日）':'抵港日','V/V（船名航次）':'船名航次','C/V（货量）':'货量','S/M（运输方式）':'运输方式','V/P（船舶位置）':'船舶位置','快递位置': '快递位置' },
            stepLabels: ['已进仓','已进港','已启运','航行中','已到港','已卸船（清关）','已派送','已交付'],
            disclaimer: '物流数据由 BLM Logistic 维护，仅供参考'
        },
        en: {
            title:'BLM Cargo Tracking System (Beta)', subtitle:'Real-time cargo status inquiry', company:'BLM Logistic',
            clientPrefix:'Client: ', totalShipments:' shipments', noData:'No shipments in transit', noDataFiltered:'No shipments in this category',
            noClient:'Please enter your exclusive client code', contactUs:'Track your cargo status',
            statusUnknown:'Not updated', currentStatus:'Current Status', viewOnMap:'Click to View',
            blLabel:'B/L: ', loading:'Loading shipments...',
            filterAll:'All Orders', filterInProgress:'In Progress', filterCompleted:'Completed',
            enterCodePlaceholder:'Enter your exclusive client code', queryBtn:'Track Now', invalidCode:'Please enter a valid client code',
            fieldLabels: { 'POL（起运港）':'POL','POD（目的港）':'POD','ETD（开航日）':'ETD','ETA（抵港日）':'ETA','V/V（船名航次）':'V/V','C/V（货量）':'C/V','S/M（运输方式）':'S/M','V/P（船舶位置）':'Vessel Position','快递位置': 'Express Tracking' },
            stepLabels: ['Received at Warehouse','Arrived at Port','Departed','In Transit','Arrived at Destination Port','Discharged (Customs Clearance)','Out for Delivery','Delivered'],
            disclaimer: 'Logistics data maintained by BLM Logistic, for reference only'
        }
    };

    const urlParams = new URLSearchParams(window.location.search);
    const lang = urlParams.get('lang') === 'en' ? 'en' : 'zh';
    const t = LANG[lang];
    const client = urlParams.get('client');
    const API_URL = `https://api.airtable.com/v0/${BASE_ID}/${TABLE_ID}`;

    // ---------- 工具函数 ----------
    function getStepIndex(stateVal) {
        if (!stateVal) return -1;
        const s = String(stateVal).trim().toLowerCase();
        for (let i = STEPS_COUNT - 1; i >= 0; i--) {
            if (STEPS_KEYWORDS[i].keywords.some(kw => s.includes(kw))) return i;
        }
        return -1;
    }

    function buildStepperHTML(fields, stepIndex) {
        let html = '<div class="stepper"><div class="steps-container">';
        STEPS_KEYWORDS.forEach((step, idx) => {
            let cls = idx < stepIndex ? 'done' : (idx === stepIndex ? 'active' : '');
            let timeHtml = '';
            if (idx <= stepIndex && step.timeField) {
                const tv = fields[step.timeField];
                if (tv) timeHtml = `<div class="step-time">${tv}</div>`;
            }
            html += `<div class="step-item ${cls}">
                <div class="step-circle">${idx < stepIndex ? '✓' : idx + 1}</div>
                <div class="step-label">${t.stepLabels[idx]}</div>${timeHtml}
            </div>`;
        });
        html += '</div>';
        const statusText = stepIndex >= 0 ? t.stepLabels[stepIndex] : t.statusUnknown;
        html += `<div class="current-status">📌 ${t.currentStatus}：${statusText}</div></div>`;
        return html;
    }

    function getBadgeColor(stepIndex) {
        if (stepIndex === 7) return '#10b981';
        if (stepIndex === 4 || stepIndex === 5) return '#8b5cf6';
        if (stepIndex === 3) return '#f59e0b';
        if (stepIndex === 6) return '#f97316';
        return '#3b82f6';
    }

    function sortRecords(records) {
        records.sort((a, b) => {
            const stateA = a.fields['state'] || '';
            const stateB = b.fields['state'] || '';
            const stepA = getStepIndex(stateA);
            const stepB = getStepIndex(stateB);
            const isDeliveredA = (stepA === 7);
            const isDeliveredB = (stepB === 7);
            if (isDeliveredA && !isDeliveredB) return 1;
            if (!isDeliveredA && isDeliveredB) return -1;
            if (isDeliveredA && isDeliveredB) return 0;
            const etdA = a.fields['ETD（开航日）'];
            const etdB = b.fields['ETD（开航日）'];
            const dateA = etdA ? new Date(etdA) : new Date('2099-12-31');
            const dateB = etdB ? new Date(etdB) : new Date('2099-12-31');
            if (isNaN(dateA.getTime()) && isNaN(dateB.getTime())) return 0;
            if (isNaN(dateA.getTime())) return 1;
            if (isNaN(dateB.getTime())) return -1;
            return dateA - dateB;
        });
    }

    // ---------- 渲染订单列表 ----------
    function renderShipments(filterType) {
        const resultArea = document.getElementById('resultArea');
        let filteredRecords = [];

        if (filterType === 'completed') {
            filteredRecords = allRecords.filter(r => getStepIndex(r.fields['state']) === 7);
        } else if (filterType === 'inProgress') {
            filteredRecords = allRecords.filter(r => getStepIndex(r.fields['state']) !== 7);
        } else {
            filteredRecords = [...allRecords];
        }

        sortRecords(filteredRecords);

        if (!filteredRecords.length) {
            resultArea.innerHTML = `<div class="error-box">📭 ${t.noDataFiltered}</div>`;
            return;
        }

        let html = '<div class="shipment-list">';
        filteredRecords.forEach(r => {
            const f = r.fields;
            const bl = f['B/L'] || '—';
            const state = f['state'] || '';
            const stepIndex = getStepIndex(state);
            const statusLabel = stepIndex >= 0 ? t.stepLabels[stepIndex] : (state || t.statusUnknown);
            const badgeColor = getBadgeColor(stepIndex);

            // 详情部分（默认折叠在 card-body 内）
            let detailsHtml = buildStepperHTML(f, stepIndex);
            detailsHtml += `<div class="detail-grid">`;
            detailsHtml += DETAIL_FIELDS.map(field => {
                if (f[field] === undefined) return '';

                let val = f[field] || '—';

                if (field === 'S/M（运输方式）' && typeof val === 'string') {
                    const parts = val.split(/\s+|\//);
                    if (lang === 'zh') {
                        val = parts[0] || val;
                    } else {
                        val = parts.slice(1).join(' ') || val;
                    }
                }

                let valHtml = val;

                if ((field === 'V/P（船舶位置）' || field === '快递位置') && typeof val === 'string' && val.match(/^https?:\/\//i))
                    valHtml = `<a href="${val}" target="_blank" rel="noopener" class="vp-link">${t.viewOnMap}</a>`;

                return `<div class="detail-item">
                    <span class="detail-label">${t.fieldLabels[field] || field}</span>
                    <span class="detail-value">${valHtml}</span>
                </div>`;
            }).join('');
            detailsHtml += `</div>`;

            // 注意：shipment-card 默认不带 expanded，即默认折叠
            html += `
            <div class="shipment-card">
                <div class="card-header" role="button" tabindex="0" aria-expanded="false">
                    <div class="header-left">
                        <span class="bl-number">📌 ${t.blLabel} ${bl}</span>
                    </div>
                    <div class="header-right">
                        <span class="status-badge" style="background:${badgeColor}20; color:${badgeColor}; border:1px solid ${badgeColor}40;">${statusLabel}</span>
                        <span class="expand-icon" aria-hidden="true"><i class="fas fa-chevron-down"></i></span>
                    </div>
                </div>
                <div class="card-body">
                    <div class="card-body-inner">
                        ${detailsHtml}
                    </div>
                </div>
            </div>`;
        });
        html += '</div>';
        resultArea.innerHTML = html;
    }

    // ---------- 界面初始化 ----------
    document.getElementById('mainTitle').innerText = t.title;
    document.getElementById('subtitleText').innerText = t.subtitle;
    document.getElementById('companyText').innerText = t.company;
    document.getElementById('disclaimer').innerText = t.disclaimer;

    // 初始化筛选按钮文案
    document.getElementById('btnAll').innerText = t.filterAll;
    document.getElementById('btnInProgress').innerText = t.filterInProgress;
    document.getElementById('btnCompleted').innerText = t.filterCompleted;

    const basePath = location.origin + location.pathname;
    const clientParam = client ? `?client=${client}` : '';
    const zhUrl = `${basePath}${clientParam}${clientParam ? '&' : '?'}lang=zh`;
    const enUrl = `${basePath}${clientParam}${clientParam ? '&' : '?'}lang=en`;
    document.getElementById('langSwitcher').innerHTML = `<a href="${zhUrl}">中文</a>|<a href="${enUrl}">English</a>`;

    // ---------- 折叠/展开交互 ----------
    document.getElementById('resultArea').addEventListener('click', e => {
        const header = e.target.closest('.card-header');
        if (!header) return;
        if (e.target.tagName === 'A' || e.target.closest('a')) return;
        const card = header.closest('.shipment-card');
        if (!card) return;
        const open = card.classList.toggle('expanded');
        header.setAttribute('aria-expanded', String(open));
    });

    document.getElementById('resultArea').addEventListener('keydown', e => {
        const header = e.target.closest('.card-header');
        if (!header) return;
        if (e.key === 'Enter' || e.key === ' ') {
            e.preventDefault();
            const card = header.closest('.shipment-card');
            if (!card) return;
            const open = card.classList.toggle('expanded');
            header.setAttribute('aria-expanded', String(open));
        }
    });
    document.addEventListener('keydown', e => {
        if (e.key !== 'Escape') return;
        const opened = document.querySelectorAll('.shipment-card.expanded');
        if (!opened.length) return;
        const last = opened[opened.length - 1];
        last.classList.remove('expanded');
        const h = last.querySelector('.card-header');
        if (h) { h.setAttribute('aria-expanded', 'false'); h.focus(); }
    });

    // ---------- 筛选按钮交互 ----------
    document.getElementById('filterBar').addEventListener('click', e => {
        const btn = e.target.closest('.filter-btn');
        if (!btn) return;
        // 切换按钮高亮状态
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        // 重新渲染列表
        renderShipments(btn.dataset.filter);
    });

    if (client) {
        document.getElementById('clientBar').style.display = 'flex';
        document.getElementById('filterBar').style.display = 'flex';
        loadClientData(client);
    } else {
        // 渲染首页输入框
        document.getElementById('resultArea').innerHTML = `
            <div style="text-align:center; padding:40px 20px;">
                <div style="font-size:48px; margin-bottom:16px;">🔍</div>
                <div style="font-size:18px; font-weight:600; color:#1e293b; margin-bottom:8px;">${t.noClient}</div>
                <div style="font-size:14px; color:#64748b;">${t.contactUs}</div>
                <div class="entry-box">
                    <div class="code-input-group">
                        <input type="text" id="clientCodeInput" class="code-input" placeholder="${t.enterCodePlaceholder}" />
                        <button class="query-btn" id="queryBtn">${t.queryBtn}</button>
                    </div>
                    <div id="errorMsg" class="error-msg"></div>
                </div>
            </div>`;
        
        // 绑定输入框交互事件
        const queryBtn = document.getElementById('queryBtn');
        const clientCodeInput = document.getElementById('clientCodeInput');
        const errorMsg = document.getElementById('errorMsg');
        
        function handleQuery() {
            const code = clientCodeInput.value.trim();
            if (!code) {
                errorMsg.innerText = t.invalidCode;
                clientCodeInput.focus();
                return;
            }
            // 跳转并保持当前语言
            const langParam = urlParams.get('lang') === 'en' ? '&lang=en' : '&lang=zh';
            window.location.href = `${basePath}?client=${encodeURIComponent(code)}${langParam}`;
        }
        
        queryBtn.addEventListener('click', handleQuery);
        clientCodeInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') handleQuery();
        });
        clientCodeInput.addEventListener('input', () => {
            errorMsg.innerText = '';
        });
    }

    async function loadClientData(clientCode) {
        const resultArea = document.getElementById('resultArea');
        resultArea.innerHTML = `<div class="loading-spinner"><div class="spinner"></div>${t.loading}</div>`;
        try {
            const filter = encodeURIComponent(`{客户代码}="${clientCode}"`);
            const url = `${API_URL}?filterByFormula=${filter}`;
            const resp = await fetch(url, {
                headers: {
                    'Authorization': `Bearer ${AIRTABLE_TOKEN}`
                }
            });
            if (!resp.ok) throw new Error(`Server error (${resp.status})`);
            const data = await resp.json();
            
            // 保存到全局变量
            allRecords = data.records || [];

            const customerName = allRecords.length > 0 ? (allRecords[0].fields['客户名称'] || clientCode) : clientCode;
            document.getElementById('clientName').innerText = `${t.clientPrefix}${customerName}`;
            document.getElementById('recordCount').innerText = `${allRecords.length} ${t.totalShipments}`;

            if (!allRecords.length) {
                resultArea.innerHTML = `<div class="error-box">📭 ${t.noData}</div>`;
                document.getElementById('filterBar').style.display = 'none';
                return;
            }
            
            // 默认渲染全部订单
            renderShipments('all');
        } catch (e) {
            resultArea.innerHTML = `<div class="error-box">⚠️ 加载失败：${e.message}</div>`;
            document.getElementById('filterBar').style.display = 'none';
        }
    }
</script>
</body>
</html>
